# HIK Agent — Nginx 反向代理配置
# 部署路径: /etc/nginx/conf.d/hik-agent.conf
#
# 前提条件:
#   - 前端已构建: /opt/hik-agent/frontend/dist/
#   - 后端 PM2 运行在 localhost:3001

server {
    listen 80;
    server_name _;

    # ── 前端静态文件 ──────────────────────────────────────────
    root /opt/hik-agent/frontend/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 大文件上传限制（600M 覆盖 ~500M 文件）
    client_max_body_size    600M;
    # 接收客户端请求体超时（大文件上传可能需要较长时间）
    client_body_timeout     600s;
    # 请求体写入磁盘缓冲目录，避免大文件占用内存
    client_body_temp_path   /tmp/nginx_upload 1 2;

    # ── 后端 API 反向代理 ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # 关闭请求缓冲：nginx 直接将上传流转发给后端，不先缓存到磁盘
        proxy_request_buffering off;

        # SSE / 流式响应支持
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
        proxy_buffering    off;
        proxy_cache        off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 超时（大文件上传 + 文档解析可能耗时较长）
        proxy_connect_timeout  10s;
        proxy_send_timeout     600s;
        proxy_read_timeout    1800s;
    }

    # 健康检查直接穿透到后端
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # 安全：隐藏版本号
    server_tokens off;
}
