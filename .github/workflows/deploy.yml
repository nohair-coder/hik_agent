name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 构建前端 ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── 打包产物 ────────────────────────────────────────────────
      - name: Package artifacts
        run: |
          # 前端构建产物
          tar -czf /tmp/frontend-dist.tar.gz -C frontend dist

          # 后端源码（排除 node_modules / dist）
          tar -czf /tmp/backend-src.tar.gz \
            --exclude='backend/node_modules' \
            --exclude='backend/dist' \
            backend ecosystem.config.cjs

      # ── 配置 SSH ─────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # ── 上传文件 ─────────────────────────────────────────────────
      - name: Upload artifacts to server
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/frontend-dist.tar.gz \
            /tmp/backend-src.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      # ── 远程部署 ─────────────────────────────────────────────────
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e

          echo "=== [1/5] 解压前端产物 ==="
          tar -xzf /tmp/frontend-dist.tar.gz -C /opt/hik-agent/
          rm -f /tmp/frontend-dist.tar.gz

          echo "=== [2/5] 解压后端源码 ==="
          tar -xzf /tmp/backend-src.tar.gz -C /opt/hik-agent/
          rm -f /tmp/backend-src.tar.gz

          echo "=== [3/5] 安装后端依赖并构建 ==="
          cd /opt/hik-agent/backend
          npm install --prefer-offline
          npm run build

          echo "=== [4/5] 重启后端服务 ==="
          cd /opt/hik-agent
          pm2 delete hik-agent-backend 2>/dev/null || true
          pm2 start ecosystem.config.cjs --only hik-agent-backend
          pm2 save

          echo "=== [5/5] 健康检查 ==="
          sleep 5
          STATUS=$(curl -s http://localhost:3001/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
          if [ "$STATUS" = "ok" ]; then
            echo "✓ 后端健康检查通过 (model: $(curl -s http://localhost:3001/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('model',''))" 2>/dev/null))"
          else
            echo "✗ 后端健康检查失败，状态: $STATUS"
            pm2 logs hik-agent-backend --lines 30 --nostream
            exit 1
          fi

          echo "✓ 部署完成"
          EOF
